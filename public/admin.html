<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Little Owl · Admin</title>
<style>
:root{--ink:#1A1A1A;--muted:#5E5E5E;--line:#E4E3DE;--bg:#F6F5F2;--amber:#E0952B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:22px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:30px 0 12px}
header{display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
input,select{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;width:100%}
button{font:600 14px system-ui;padding:9px 14px;border-radius:8px;border:1.5px solid var(--ink);background:#fff;cursor:pointer}
button.p{background:var(--ink);color:#fff}button.d{border-color:#C0392B;color:#C0392B}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.s{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}.pending{background:#FDEFD3}.confirmed{background:#D8F0E1}.cancelled{background:#EEE;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px}.err{color:#C0392B}.x{overflow-x:auto}
#login{max-width:340px;margin:12vh auto}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div id="login" class="card"><h1>Little Owl admin</h1><p style="color:var(--muted)">Sign in to manage reservations and the menu.</p>
<form id="lf"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required style="margin-bottom:10px"><button class="p" style="width:100%">Sign in</button><p class="err" id="le"></p></form></div>
<div id="app" hidden>
<header><h1>Little Owl admin</h1><button id="out">Sign out</button></header>
<h2>Reservations</h2><div class="card x"><table><thead><tr><th>When</th><th>Guest</th><th>Party</th><th>Status</th><th></th></tr></thead><tbody id="rb"></tbody></table><p id="re" style="color:var(--muted)"></p></div>
<h2>Menu</h2><div class="card"><form class="grid" id="mf">
<input id="mc" placeholder="Category" required list="cl"><datalist id="cl"></datalist><input id="mn" placeholder="Dish name" required><input id="md" placeholder="Short description"><input id="mt" placeholder="Tag (e.g. Popular)"><button class="p">Add</button></form>
<table style="margin-top:12px"><tbody id="mb"></tbody></table></div></div></div>
<script>
var T=sessionStorage.getItem("t"),$=function(i){return document.getElementById(i)};
function api(p,o){o=o||{};o.headers=Object.assign({"Content-Type":"application/json",Authorization:"Bearer "+T},o.headers);
 return fetch(p,o).then(function(r){if(r.status===401&&T){logout();throw 0}return r.json()})}
function logout(){sessionStorage.removeItem("t");T=null;$("app").hidden=true;$("login").hidden=false}
function cell(tr,txt,cls){var td=document.createElement("td");if(cls){var s=document.createElement("span");s.className=cls;s.textContent=txt;td.appendChild(s)}else td.textContent=txt;tr.appendChild(td);return td}
function btn(td,txt,cls,fn){var b=document.createElement("button");b.textContent=txt;b.className=cls||"";b.style.marginRight="6px";b.onclick=fn;td.appendChild(b)}
function load(){
 $("login").hidden=true;$("app").hidden=false;
 api("/api/handler?route=admin/reservations").then(function(rs){
  var tb=$("rb");tb.innerHTML="";$("re").textContent=rs.length?"":"No reservations yet.";
  rs.forEach(function(r){var tr=document.createElement("tr");
   cell(tr,r.date+" "+r.time);var g=cell(tr,r.name+" · "+r.phone);if(r.note){g.appendChild(document.createElement("br"));var n=document.createElement("small");n.textContent=r.note;g.appendChild(n)}
   cell(tr,r.guests);cell(tr,r.status,"s "+r.status);var a=document.createElement("td");
   if(r.status!=="confirmed")btn(a,"Confirm","p",function(){set(r.id,"confirmed")});
   if(r.status!=="cancelled")btn(a,"Cancel","",function(){set(r.id,"cancelled")});
   btn(a,"Delete","d",function(){if(confirm("Delete this reservation?"))api("/api/handler?route=admin/reservations&id="+r.id,{method:"DELETE"}).then(load)});
   tr.appendChild(a);tb.appendChild(tr)})}).catch(function(){});
 fetch("/api/handler?route=menu").then(function(r){return r.json()}).then(function(ms){
  var tb=$("mb");tb.innerHTML="";var cats={};
  ms.forEach(function(m){cats[m.cat]=1;var tr=document.createElement("tr");cell(tr,m.cat);cell(tr,m.name);cell(tr,m.tag);var a=document.createElement("td");
   btn(a,"Remove","d",function(){if(confirm("Remove "+m.name+"?"))api("/api/handler?route=admin/menu&id="+m.id,{method:"DELETE"}).then(load)});tr.appendChild(a);tb.appendChild(tr)});
  $("cl").innerHTML="";Object.keys(cats).forEach(function(c){var o=document.createElement("option");o.value=c;$("cl").appendChild(o)})})}
function set(id,s){api("/api/handler?route=admin/reservations&id="+id,{method:"PATCH",body:JSON.stringify({status:s})}).then(load)}
$("mf").onsubmit=function(e){e.preventDefault();api("/api/handler?route=admin/menu",{method:"POST",body:JSON.stringify({cat:$("mc").value,name:$("mn").value,desc:$("md").value,tag:$("mt").value})}).then(function(){$("mf").reset();load()})};
$("lf").onsubmit=function(e){e.preventDefault();$("le").textContent="Signing in…";
 fetch("/api/handler?route=admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value})})
 .then(function(r){return r.text().then(function(t){var j;try{j=JSON.parse(t)}catch(x){j=null}
  if(j&&j.token){T=j.token;sessionStorage.setItem("t",T);$("pw").value="";$("le").textContent="";load()}
  else $("le").textContent=(j&&j.error)||"Server problem (HTTP "+r.status+"). The API is not running correctly. Check the Vercel deployment logs."})})
 .catch(function(){$("le").textContent="Could not reach the server. Check your internet and try again."})};
$("out").onclick=logout;if(T)load();
</script></body></html>
